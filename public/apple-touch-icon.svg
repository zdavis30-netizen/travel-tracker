<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="88" fill="url(#bg)"/>
  <!-- Flight arc -->
  <path d="M 105,320 Q 256,110 407,320" fill="none" stroke="#38bdf8" stroke-width="4" stroke-dasharray="13 18" opacity="0.45"/>
  <!-- Airport dots -->
  <circle cx="105" cy="320" r="9" fill="#38bdf8" opacity="0.8"/>
  <circle cx="407" cy="320" r="9" fill="#38bdf8" opacity="0.8"/>
  <!-- Z -->
  <text x="105" y="438" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="108" font-weight="800" fill="white" text-anchor="middle" opacity="0.93">Z</text>
  <!-- A -->
  <text x="407" y="438" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="108" font-weight="800" fill="white" text-anchor="middle" opacity="0.93">A</text>
  <!-- Airplane at arc apex (~256, 215), pointing right -->
  <g transform="translate(256,215) scale(4.8)">
    <path d="M 12,0 C 9,-1 -3,-1.5 -8,-2 L -8,-10 C -8,-12 -11,-12 -11,-10 L -10,-2 L -14,-1.5 L -14,1.5 L -10,2 L -11,10 C -11,12 -8,12 -8,10 L -8,2 C -3,1.5 9,1 12,0 Z" fill="white"/>
